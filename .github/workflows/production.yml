# Production deploys happen only by hand (ADR 0013): Actions → "Deploy production" → Run workflow,
# typing "deploy" to confirm. The commit must already be green on main (CI deploys it to staging).
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to deploy main to production'
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    # Add the Cloudflare secrets to this GitHub environment; a required reviewer adds a last check.
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Apply D1 migrations (production)
        run: pnpm --filter @yegna/api db:migrate:production
      - name: Deploy API
        run: pnpm --filter @yegna/api deploy:production
      - name: Deploy PWA
        run: pnpm --filter @yegna/pwa deploy:production
      - name: Deploy website
        run: pnpm --filter @yegna/web deploy:production
      - name: Smoke test
        run: curl -fsS https://yegna-api.yegna-api.workers.dev/health | grep '"ok":true'
